
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Change Admin Credentials</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">
</head>

<body class="credentials-page">

    <div class="credentials-container">

        <h2>Change Admin Credentials</h2>

        <p class="credentials-subtitle">
            Update your admin username and password securely.
        </p>

        <form method="POST">

            <div class="form-group">
                <label>Current Password</label>
                <input type="password"
                       name="current_password"
                       placeholder="Enter current password"
                       required>
            </div>

            <div class="form-group">
                <label>New Username</label>
                <input type="text"
                       name="new_username"
                       placeholder="Enter new username"
                       required>
            </div>

            <div class="form-group">
                <label>New Password</label>
                <input type="password"
                       name="new_password"
                       placeholder="Minimum 8 characters"
                       minlength="8"
                       required>
            </div>

            <div class="form-group">
                <label>Confirm New Password</label>
                <input type="password"
                       name="confirm_password"
                       placeholder="Confirm new password"
                       minlength="8"
                       required>
            </div>

            <button type="submit" class="update-button">
                Update Credentials
            </button>

        </form>

        <a href="{{ url_for('admin_dashboard') }}" class="back-link">
            ← Back to Dashboard
        </a>

    </div>

</body>
</html>
